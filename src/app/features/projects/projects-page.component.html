@let t = translations().projectsPage;

<div class="page container">
  <app-section-header [level]="1" [eyebrow]="t.eyebrow" [title]="t.title" [description]="t.description" />

  <div class="toolbar">
    <app-project-filter
      [categories]="categories()"
      [selected]="selectedFilter()"
      [label]="t.filterLabel"
      [allLabel]="t.allFilter"
      (selectedChange)="onFilterChange($event)"
    />
    <p class="toolbar__count" aria-live="polite">{{ resultLabel() }}</p>
  </div>

  <ul class="card-grid">
    @for (project of visibleProjects(); track project.id) {
      <li class="grid-item">
        <app-project-card [project]="project" [category]="getCategory(project.categoryId)" />
      </li>
    } @empty {
      <li class="empty">{{ t.empty }}</li>
    }
  </ul>

  <app-call-to-action class="cta" appReveal />
</div>
