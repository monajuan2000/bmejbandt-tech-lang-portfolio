@let t = translations().categoriesSection;

<section class="section container" aria-labelledby="categories-title">
  <app-section-header
    appReveal
    headingId="categories-title"
    [eyebrow]="t.eyebrow"
    [title]="t.title"
    [description]="t.description"
  />

  <ul class="card-grid">
    @for (category of categories(); track category.id; let index = $index) {
      <li [appReveal]="index * 70">
        <a
          class="category glass hover-lift"
          routerLink="/projects"
          [queryParams]="{ category: category.id }"
          [style.--category-accent]="category.accent"
        >
          <span class="icon-tile category__icon">
            <app-icon [name]="category.icon" [size]="22" />
          </span>
          <span class="category__body">
            <span class="category__name">{{ category.name }}</span>
            <span class="category__description">{{ category.description }}</span>
          </span>
          <span class="category__count">
            {{ category.projectCountLabel }}
            <app-icon name="arrow-right" [size]="16" />
          </span>
        </a>
      </li>
    }
  </ul>
</section>
