<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Juan Esteban Mona | Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Juan Esteban Mona — software engineer building products, systems, and experiences across frontend, backend, data, and cloud."
    />
    <meta name="theme-color" content="#070b16" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved/system theme and language before first paint. Mirrors ThemeService and LanguageService.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio-theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          root.setAttribute('data-theme', theme);

          var language = localStorage.getItem('portfolio-language') || navigator.language.slice(0, 2).toLowerCase();
          root.setAttribute('lang', language === 'es' ? 'es' : 'en');
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
