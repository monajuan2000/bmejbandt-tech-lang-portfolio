<div class="filter" role="group" [attr.aria-label]="label()">
  <button type="button" class="chip" [attr.aria-pressed]="selected() === 'all'" (click)="select('all')">
    {{ allLabel() }}
  </button>

  @for (category of categories(); track category.id) {
    <button
      type="button"
      class="chip"
      [style.--chip-accent]="category.accent"
      [attr.aria-pressed]="selected() === category.id"
      (click)="select(category.id)"
    >
      {{ category.name }}
    </button>
  }
</div>
