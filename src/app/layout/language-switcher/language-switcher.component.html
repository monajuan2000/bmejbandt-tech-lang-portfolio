<div class="switcher" role="group" [attr.aria-label]="translations().header.languageSwitcher">
  <span class="switcher__indicator" aria-hidden="true"></span>

  @for (option of options; track option.code) {
    <button
      type="button"
      class="switcher__option"
      [attr.lang]="option.code"
      [attr.aria-label]="option.nativeName"
      [attr.aria-pressed]="language() === option.code"
      [attr.title]="option.nativeName"
      (click)="select(option.code)"
    >
      {{ option.shortLabel }}
    </button>
  }
</div>
